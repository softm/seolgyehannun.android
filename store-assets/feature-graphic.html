<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<style>
  *{box-sizing:border-box}html,body{margin:0;width:1024px;height:500px;overflow:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#f7f3e8;color:#124d42;position:relative}
  .sun{position:absolute;right:-55px;top:-90px;width:360px;height:360px;border-radius:50%;background:#f5b9422e}
  .leaf{position:absolute;left:-130px;bottom:-210px;width:440px;height:440px;border-radius:50%;background:#124d4214}
  main{position:relative;padding:76px 92px}
  .brand{display:flex;align-items:center;gap:32px}
  .mark{width:118px;height:118px;border-radius:28px;background:#124d42;display:grid;place-items:center}
  .paper{width:52px;height:58px;background:#fffdf5;position:relative;padding-top:20px}
  .paper:before{content:"";position:absolute;left:13px;top:-13px;width:26px;height:22px;background:#f5b942}
  .paper:after{content:"";position:absolute;left:12px;right:12px;top:30px;height:12px;border-top:2px solid #124d42;border-bottom:2px solid #124d42}
  h1{font-size:66px;margin:0;font-weight:850;letter-spacing:-3px}
  h2{font-size:42px;margin:72px 0 18px;color:#1f2d2a;letter-spacing:-2px}
  p{font-size:27px;margin:0;color:#52605d;letter-spacing:-.7px}
  .pill{display:inline-block;margin-top:34px;padding:15px 30px;border-radius:999px;background:#124d42;color:white;font-size:24px;font-weight:750}
</style>
<body><div class="sun"></div><div class="leaf"></div><main>
  <div class="brand"><div class="mark"><div class="paper"></div></div><h1>설계한눈</h1></div>
  <h2>흩어진 인허가 업무를 한눈에</h2>
  <p>현장 · 일정 · 문서 · 접수 관리를 하나의 업무 공간에서</p>
  <div class="pill">인허가 업무관리</div>
</main></body></html>
